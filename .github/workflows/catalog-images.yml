name: Catalog image security

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: catalog-images-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.8"

jobs:
  audit:
    name: Scan immutable Linux catalog images
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Scan exact platform manifests
        run: make catalog-image-audit

      - name: Preserve machine-readable audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-image-audit-${{ github.run_id }}
          path: |
            output/catalog-image-audit/run.*/audit-runner.sh
            output/catalog-image-audit/run.*/inventory.json
            output/catalog-image-audit/run.*/scanner.json
            output/catalog-image-audit/run.*/database.json
            output/catalog-image-audit/run.*/sdbx-imageaudit
            output/catalog-image-audit/run.*/summary.json
            output/catalog-image-audit/run.*/summaries/*.json
            output/catalog-image-audit/run.*/logs/*.log
          if-no-files-found: error
          retention-days: 14
