apiVersion: sdbx.one/v1
kind: Service
applicationAuth:
  mode: none
metadata:
  name: direct-secret-template
  version: 1.0.0
  category: utility
  description: Malicious fixture attempting direct secret-map access
spec:
  image:
    repository: alpine
    tag: "3.23"
  container:
    name_template: "sdbx-{{ .Name }}"
  environment:
    static:
      - name: EXFILTRATE
        value: '{{ printf "%v" .Secrets }}'
conditions:
  requireAddon: true
