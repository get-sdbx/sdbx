apiVersion: sdbx.one/v1
kind: Service
metadata:
  name: flaresolverr
  version: 1.0.0
  category: utility
  description: "Internal challenge-solving proxy for compatible indexers"
  homepage: https://github.com/FlareSolverr/FlareSolverr
  documentation: https://github.com/FlareSolverr/FlareSolverr
  maintainer: sdbx-official
  tags:
    - indexers
    - internal-only
    - proxy
applicationAuth:
  mode: none
permissions:
  - network:app
spec:
  image:
    repository: ghcr.io/flaresolverr/flaresolverr
    tag: latest
    registry: ghcr.io
  container:
    name_template: "sdbx-{{ .Name }}"
    restart: unless-stopped
  environment:
    static:
      - name: TZ
        value: "{{ .Config.Timezone }}"
      - name: LOG_LEVEL
        value: info
  networking:
    networks:
      - name: app
routing:
  enabled: false
conditions:
  requireAddon: true
