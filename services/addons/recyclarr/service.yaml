apiVersion: sdbx.one/v1
kind: Service
metadata:
  name: recyclarr
  version: 1.0.0
  category: utility
  description: "Scheduled quality-profile synchronization for Sonarr and Radarr"
  homepage: https://recyclarr.dev
  documentation: https://recyclarr.dev/guide/installation/docker/
  maintainer: sdbx-official
  tags:
    - arr-stack
    - quality
    - internal-only
applicationAuth:
  mode: none
permissions:
  - config-path
  - host-chown
  - network:app
spec:
  image:
    repository: ghcr.io/recyclarr/recyclarr
    tag: latest
    registry: ghcr.io
  container:
    name_template: "sdbx-{{ .Name }}"
    restart: unless-stopped
    user: "{{ .Config.PUID }}:{{ .Config.PGID }}"
  environment:
    static:
      - name: TZ
        value: "{{ .Config.Timezone }}"
      - name: CRON_SCHEDULE
        value: "@daily"
      - name: RECYCLARR_CREATE_CONFIG
        value: "true"
  volumes:
    - name: config
      hostPath: "{{ .Config.ConfigPath }}/recyclarr"
      containerPath: /config
      chown: true
  networking:
    networks:
      - name: app
routing:
  enabled: false
conditions:
  requireAddon: true
